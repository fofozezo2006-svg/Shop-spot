<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Spot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container1">
        <div class="header">
            <div class="header-top">
                <div class="logo">
                    <a href="index.html"><img src="Assets/logo.png" alt="logo"></a>
                </div>
                
                <div class="search">
                    <input type="text" placeholder="Search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            
                <div class="cart">
                    <div class="cart-item">
                        <a href="cart.html" class="cart-link">
                            <i class="fa-solid fa-cart-shopping"></i>
                        </a>
                    </div>
                </div>
            </div> 

            <div class="header-bottom">
                <div class="menu">
                    <nav class="nav-links">
                        <ul>
                            <li><a href="index.html">Home</a></li>
                            <li><a href="iphones.html">iphones</a></li>
                            <li><a href="Sumsung.html">Sumsung</a></li>
                            <li><a href="./cart.html" class="active">Cart</a></li>
                        </ul>
                    </nav>
                </div>

                <div class="sign">
                    <button class="sign-up">Sign Up</button>
                    <button class="sign-in">Log In</button>
                </div>
            </div> 
        </div>
      

    </div>
    <main class="cart-page">
        <div class="checkoutAll">
            <div class="checkForm">
                <h3>Checkout</h3>
                <form class="checkout-form" id="checkout-form">
    
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" class="form-control" id="email" placeholder="username@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="text" class="form-control" id="phone" placeholder="Enter your phone number" required pattern="[0-9]{11}" maxlength="11">
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" class="form-control" id="address" placeholder="Enter your address" required>
                    </div>
                    <button id="submit_check">Submit</button>
                </form>
    
            </div>
        </div>
        
    </main>
    <div class="payment">
        <i class="fa-solid fa-circle-check"></i>
        <h3>Payment Successful</h3>
        <p>Your order has been placed successfully. We will send you an email with all the details.</p>
        <a href="index.html">
            <button id="submit_check">Go Back</button>
    </div>
    





  <footer>

        <div class="footer-links">
            <a href="#"><i class="fa-brands fa-facebook"></i></a> 
            <a href="#"><i class="fa-brands fa-instagram"></i></a>
            <a href="#"><i class="fa-brands fa-youtube"></i></a>
            <a href="#"><i class="fa-brands fa-twitter"></i></a>
        </div>
        <p>Copyright &copy; 2026 ShopSpot. All Rights Reserved.</p>
    </footer>


    <script src="js/checkout.js"></script>
    <script src="js/cart.js"></script>

</body>
</html>
